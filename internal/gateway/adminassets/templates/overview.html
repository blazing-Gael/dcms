{{define "content"}}
<div class="page-head"><h1>Overview</h1></div>
<div class="grid">
  {{range .Data}}
  <a class="card stat" href="{{.Href}}">
    <div class="stat-num">{{.Count}}</div>
    <div class="stat-label">{{.Name | title}}</div>
  </a>
  {{else}}
  <p class="muted">No collections defined.</p>
  {{end}}
</div>
{{end}}
