# Example DCMS config file.
#
# Every setting is optional — anything you omit falls back to a built-in default,
# so the smallest valid config is an empty file. Values here can still be
# overridden at launch by an env var (DCMS_SCHEMA, DCMS_DB, DCMS_DB_DRIVER,
# DCMS_PORT) or a command-line flag, in that increasing order of precedence.
#
# Point the CLI at this file with:  dcms dev --config ./dcms.config.yaml
# (or name it ./dcms.config.yaml in the working directory and it's picked up
# automatically).

# Path to the schema that defines your collections.
schema: ./dcms.schema.yaml

database:
  # Phase 1 ships the "sqlite" driver. "postgres" and others land later.
  driver: sqlite
  # For sqlite this is the database file; it's created if missing.
  path: ./dcms.db

server:
  # HTTP port the gateway listens on.
  port: 3000
  # Strict response validation: verify every record the server returns conforms
  # to the schema, answering 500 instead of shipping non-conforming data. Guards
  # against store/adapter drift. Defaults ON under `dcms dev`, OFF otherwise;
  # set it explicitly here to override. (Response *shaping* — e.g. booleans as
  # true/false — always happens regardless of this setting.)
  # validate_responses: true
  # Cap on a single JSON request body (create/update/auth) in bytes; omit for the
  # 1 MiB default. Media uploads are capped separately by media.max_upload_bytes.
  # Env override: DCMS_MAX_BODY_BYTES. An over-cap body answers 413.
  # max_body_bytes: 1048576
  # Per-request deadline in seconds for JSON requests; omit for the 15s default,
  # 0 also means the default, and a negative value disables it (e.g. when a proxy
  # already enforces timeouts). Env override: DCMS_REQUEST_TIMEOUT_SECONDS. A
  # request that outlives it answers 504. Media byte routes are exempt.
  # request_timeout_seconds: 15
  # Request rate limiting. Enabled by default with generous limits; set
  # enabled: false (or DCMS_RATE_LIMIT_ENABLED=false) to turn it off. The API
  # tier is keyed per authenticated principal (falling back to client IP); the
  # auth tier is keyed per client IP and guards the unauthenticated /auth
  # endpoints. Over-limit requests answer 429 with a Retry-After header. Health
  # probes and media byte routes are never limited. Omit any value for its
  # default (shown).
  # rate_limit:
  #   enabled: true
  #   api_per_minute: 6000     # ~100 req/s sustained, per principal/IP
  #   api_burst: 200
  #   auth_per_minute: 60      # per client IP
  #   auth_burst: 20
  # Trust a fronting reverse proxy's X-Forwarded-* headers: X-Forwarded-For for
  # rate-limit client-IP keying, and X-Forwarded-Proto for the session cookie's
  # Secure flag when the proxy terminates TLS. Enable ONLY behind a proxy you
  # control — otherwise a client can spoof these. Env: DCMS_TRUST_PROXY.
  # trust_proxy: false
  # Cross-origin access (CORS). OFF by default (allowed_origins empty ⇒ same-origin
  # only). List the exact browser origins your frontend is served from. Over-limit
  # is not involved; disallowed origins simply get no CORS headers. Env override
  # for origins: DCMS_CORS_ALLOWED_ORIGINS (comma-separated). Methods/headers below
  # have sensible defaults (shown) — omit to use them.
  # cors:
  #   allowed_origins: ["https://blog.example", "https://shop.example"]
  #   # allow_credentials: true   # needed for cookie-based sessions; then origins
  #   #                           # must be explicit (a wildcard "*" is rejected).
  #   # allowed_methods: [GET, POST, PATCH, DELETE, OPTIONS]
  #   # allowed_headers: [Authorization, Content-Type, Idempotency-Key, If-None-Match, X-DCMS-Preview]
  #   # exposed_headers: [ETag, Retry-After, Idempotent-Replay]
  #   # max_age_seconds: 600
  # Native HTTPS. Omit to serve plain HTTP (terminate TLS at a reverse proxy — the
  # recommended production topology). Set BOTH files to have DCMS terminate TLS
  # itself (it does not manage or renew certs). Env: DCMS_TLS_CERT_FILE / DCMS_TLS_KEY_FILE.
  # tls:
  #   cert_file: /etc/dcms/tls/fullchain.pem
  #   key_file: /etc/dcms/tls/privkey.pem
  # Idempotency keys for POST creates (ADR-0018). A create carrying an
  # `Idempotency-Key` header is safe to retry — the original response is replayed
  # rather than creating a duplicate. On by default; it is inert until a client
  # sends the header, so it costs nothing otherwise. Set enabled: false (or
  # DCMS_IDEMPOTENCY_ENABLED=false) to ignore the header. Omit any value for its
  # default (shown).
  # idempotency:
  #   enabled: true
  #   ttl_hours: 24            # how long a key is remembered for replay

media:
  # Where uploaded files (the media library) are stored: "local" or "s3".
  driver: local
  # Base directory for the local driver (created if missing).
  dir: ./dcms-media
  # Cap on a single upload in bytes; omit for the 32 MiB default.
  # max_upload_bytes: 33554432
  # Restrict uploads by content type — exact types or a trailing-slash prefix.
  # Omit to accept any type.
  # allowed_content_types: ["image/", "application/pdf"]

  # ── S3-compatible storage (driver: s3) ────────────────────────────────────
  # One driver reaches MinIO, SeaweedFS, Cloudflare R2, AWS S3, Backblaze B2, …
  # Credentials are NEVER read from this file — set them via env vars:
  #   DCMS_S3_ACCESS_KEY, DCMS_S3_SECRET_KEY
  # (endpoint/bucket/region may also come from DCMS_S3_ENDPOINT/BUCKET/REGION).
  #
  # driver: s3
  # endpoint: s3.amazonaws.com          # host[:port]; scheme optional
  # region: us-east-1                    # Cloudflare R2 uses "auto"
  # bucket: my-media
  # force_path_style: false              # true for MinIO / SeaweedFS
  # use_ssl: true                        # inferred from endpoint scheme if omitted
  # public_base_url: https://cdn.example.com  # if set, media URLs point here (CDN /
  #                                            # public bucket); else bytes proxy
  #                                            # through /__media/{id}/raw

content:
  # Record lifecycle (ADR-0012). Collections opt into `publishing:` / `soft_delete:`
  # in the SCHEMA (not here). The preview token that unlocks viewing drafts /
  # scheduled / archived / trashed content is a SECRET and so is env-only — never
  # written in this file. Set it in the environment:
  #   DCMS_PREVIEW_TOKEN=<a long random string>
  # Then send it as the `X-DCMS-Preview` header (or ?preview_token=) with
  # ?status= / ?include_deleted= to widen the view. Unset ⇒ public reads only.

auth:
  # Account lifecycle (ADR-0019). Roles themselves are declared in the SCHEMA's
  # `auth.roles:` block; this section configures the runtime account behaviors.
  # The bootstrap admin credentials are SECRETS and env-only (never in this file):
  #   DCMS_ADMIN_EMAIL, DCMS_ADMIN_PASSWORD  (seed the first admin on first run)
  #
  # Roles allowed to use the /admin/users API. Default ["admin"].
  # Env override: DCMS_ADMIN_ROLES (comma-separated).
  # admin_roles: [admin]
  #
  # Self-registration (POST /auth/register). OFF by default — enable for stores
  # that onboard customers. default_roles are granted to each new account; they
  # must be declared roles and must NOT be admin roles (no self-granting admin).
  # Env: DCMS_REGISTRATION_ENABLED.
  # registration:
  #   enabled: true
  #   default_roles: [customer]
  #
  # Password policy. min_length default 8; a hard 72-byte maximum always applies
  # (bcrypt truncates beyond that).
  # password:
  #   min_length: 8
  #
  # Password reset (POST /auth/forgot → email → POST /auth/reset). link_base is
  # your frontend reset page; the one-time token is appended as ?token=. ttl
  # default 60 min.
  # reset:
  #   link_base: "https://blog.example/reset"
  #   ttl_minutes: 60
  #
  # Mailer for account emails. Omit (no host) to use a dev-log mailer that prints
  # the reset link to the console — handy for local testing. SMTP credentials are
  # SECRETS and env-only: DCMS_SMTP_USERNAME / DCMS_SMTP_PASSWORD (host/from may
  # also come from DCMS_SMTP_HOST / DCMS_SMTP_FROM). STARTTLS (port 587).
  # smtp:
  #   host: smtp.example.com
  #   port: 587
  #   from: "no-reply@blog.example"

events:
  # Change events (ADR-0021, M-B). A collection opts in with `events: true` in the
  # SCHEMA; every state change is then logged to the engine-managed _events
  # collection and served on the change feed:
  #   GET /api/v1/_changes?since=<cursor>     (admin) — poll for changes, O(changes)
  #
  # Signed webhooks push those events to your endpoints. Each endpoint's HMAC
  # secret is a SECRET and so is env-only: secret_env names the environment
  # variable holding it (never write the secret in this file). Delivery is durable
  # (background worker, retries with backoff, dead-letter). Requests carry
  # X-DCMS-Signature (HMAC-SHA256 of "<timestamp>.<rawBody>"), X-DCMS-Timestamp,
  # X-DCMS-Event, and a stable X-DCMS-Delivery id for dedup.
  #
  # webhook_poll_seconds: 2        # how often the worker enqueues + delivers
  # webhooks:
  #   - name: site-rebuild
  #     url: https://hooks.example/dcms
  #     secret_env: DCMS_WEBHOOK_SITE_REBUILD_SECRET
  #     events: [published, unpublished, deleted]   # filter; omit for all
  #     collections: [posts, pages]                  # filter; omit for all
  #     max_attempts: 12                             # dead-letter after this many
  #
  # Inspect / recover deliveries (admin):
  #   GET  /api/v1/_events/deliveries?status=dead
  #   POST /api/v1/_events/deliveries/{id}/retry
