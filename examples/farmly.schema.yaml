# Farmly — reference e-commerce schema for LxCMS
#
# This is the canonical example used during Phase 1 development.
# It covers the most common e-commerce patterns and exercises all Phase 1 field types.
# Phase 2+ directives are included but commented out — uncomment as phases land.

version: "1"

meta:
  name: farmly
  description: "Farm-to-table marketplace — local food producers selling direct to customers"
  base_url: /api/v1

brand:
  name: "Farmly"
  tagline: "Farm to table, direct."
  colors:
    primary: "#2D6A4F"
    accent: "#52B788"
    background: "#F9FAF7"
    text: "#1A1A1A"
  fonts:
    heading: "Fraunces"
    body: "Inter"
  logo_url: "https://cdn.farmly.com/logo.svg"
  tone: "warm, honest, local"
  rtl: false
  locale: en

# ── Auth (ADR-0016) ─────────────────────────────────────────────────────
# Local identity: opaque, DB-backed sessions. Log in at POST /auth/login and
# send the returned token as `Authorization: Bearer <token>` (a HttpOnly
# `dcms_session` cookie is set too). Roles declared here are the only names an
# `access:` rule may reference — a typo is a schema-compile error.
#
# Seed the first admin with DCMS_ADMIN_EMAIL / DCMS_ADMIN_PASSWORD on first run,
# or `dcms admin create --email you@farmly.com --role admin`.
auth:
  provider: local
  session:
    ttl: 168h                     # 7 days
  roles:
    admin:
      label: "Administrator"
    vendor:
      label: "Farm / Vendor"
    customer:
      label: "Customer"

collections:

  # ── Categories ─────────────────────────────────────────────────────────
  categories:
    fields:
      name:
        type: string
        required: true
        max: 100
        label: "Category name"
      slug:
        type: string
        required: true
        unique: true
        pattern: "^[a-z0-9-]+$"
        label: "URL slug"
      description:
        type: text
        label: "Description"
      # image:                      # Phase 3
      #   type: media
    timestamps: true
    indexes: [slug]
    access:
      read: public                  # storefront browses categories anonymously
      create: [admin]
      update: [admin]
      delete: [admin]

  # ── Products ───────────────────────────────────────────────────────────
  products:
    fields:
      title:
        type: string              # Phase 2: change to i18n
        required: true
        max: 200
        label: "Product title"
      slug:
        type: string
        required: true
        unique: true
        pattern: "^[a-z0-9-]+$"
      description:
        type: text                # Phase 2: change to i18n
        label: "Full description"
      short_description:
        type: string
        max: 300
        label: "Short description (used in cards)"
      price:
        type: decimal          # exact money (ADR-0017) — scale 2, paired with `currency` below
        required: true
        min: 0
        label: "Price"
      compare_at_price:
        type: decimal
        min: 0
        label: "Original price (shown as struck-through)"
      currency:
        type: string
        default: "BDT"
        max: 3
      stock:
        type: integer
        default: 0
        min: 0
        label: "Units in stock"
      unit:
        type: string
        default: "item"
        label: "Unit label (kg, litre, item, bunch)"
      status:
        type: enum
        values: [draft, active, archived]
        default: draft
      category_id:
        type: string              # Phase 2: change to relation
        label: "Category"
      vendor_id:
        type: string              # Phase 2: change to relation
        label: "Vendor"
      origin_farm:
        type: string
        label: "Farm or origin name"
      is_organic:
        type: boolean
        default: false
        label: "Certified organic"
      is_featured:
        type: boolean
        default: false
        label: "Show on homepage"
      weight_grams:
        type: integer
        label: "Weight in grams (for shipping)"
      # images:                   # Phase 3
      #   type: media
      #   multiple: true
      # location:                 # Phase 3
      #   type: geo
      # sale_price:               # Phase 3 (computed)
      #   type: computed
      #   expr: "price * (1 - discount)"
    timestamps: true
    indexes:
      - status
      - [category_id, status]
      - is_featured
      - vendor_id
    # vectorize: [title, description, short_description]  # Phase 2
    # draft: true                 # Phase 2
    # i18n: [en, ar, bn]         # Phase 2
    access:
      read: public
      create: [admin, vendor]
      update: [admin, vendor]
      delete: [admin]
    # hooks:                      # Phase 3
    #   after_create: notify-inventory
    #   after_update: reindex-vectors

  # ── Vendors (farms) ────────────────────────────────────────────────────
  vendors:
    fields:
      name:
        type: string
        required: true
        max: 200
      slug:
        type: string
        required: true
        unique: true
        pattern: "^[a-z0-9-]+$"
      bio:
        type: text
        label: "About this farm"
      location_text:
        type: string
        label: "Area / district (e.g. Mymensingh, Bangladesh)"
      contact_email:
        type: string
        max: 255
      contact_phone:
        type: string
        max: 20
      is_active:
        type: boolean
        default: true
      verified:
        type: boolean
        default: false
        label: "Verified by Farmly team"
      # logo:                     # Phase 3
      #   type: media
      # coordinates:              # Phase 3
      #   type: geo
    timestamps: true
    indexes: [slug, is_active, verified]
    access:
      read: public
      create: [admin]             # vendors are onboarded, not self-serve
      update: [admin, vendor]
      delete: [admin]

  # ── Customers ──────────────────────────────────────────────────────────
  customers:
    fields:
      name:
        type: string
        required: true
        max: 200
      email:
        type: string
        required: true
        unique: true
        max: 255
      phone:
        type: string
        max: 20
      address_line1:
        type: string
        max: 300
      address_line2:
        type: string
        max: 300
      city:
        type: string
        max: 100
      district:
        type: string
        max: 100
        label: "District"
      country:
        type: string
        default: "BD"
        max: 2
      is_active:
        type: boolean
        default: true
    timestamps: true
    indexes: [email, is_active]
    access:
      read: [admin]               # PII — never public
      create: public              # self-registration at checkout
      update:                     # admins, or the customer editing their own row
        any: [admin, owner]
      delete: [admin]             # only admins may remove a customer record

  # ── Orders ─────────────────────────────────────────────────────────────
  orders:
    fields:
      customer_id:
        type: string              # Phase 2: relation to customers
        required: true
      status:
        type: enum
        values: [pending, confirmed, processing, shipped, delivered, cancelled, refunded]
        default: pending
      total_amount:
        type: decimal          # exact money (ADR-0017)
        required: true
        min: 0
      currency:
        type: string
        default: "BDT"
        max: 3
      payment_method:
        type: enum
        values: [bkash, nagad, card, cod]
      payment_status:
        type: enum
        values: [unpaid, paid, refunded]
        default: unpaid
      payment_reference:
        type: string
        label: "Payment gateway transaction ID"
        access:
          read: [admin]           # field-level (ADR-0016 M2): the owning customer
                                  # still gets the order, but the raw gateway txn id
                                  # is masked out of the response for non-admins.
      shipping_address:
        type: json
        label: "Snapshot of delivery address at order time"
      notes:
        type: text
        label: "Customer notes"
      vendor_id:
        type: string              # Phase 2: relation to vendors
      # delivered_at:             # add manually when needed
    timestamps: true
    indexes:
      - status
      - customer_id
      - payment_status
      - [vendor_id, status]
    # hooks:                      # Phase 3
    #   after_create: send-order-confirmation
    #   after_update: notify-status-change
    access:
      read:                       # admins see every order; a customer sees only
        any: [admin, owner]       # their own (list filtered by created_by,
                                  # get-one on someone else's order 404s).
      create: authenticated
      update: [admin]             # status changes are staff-only
      delete: [admin]

  # ── Order items ────────────────────────────────────────────────────────
  order_items:
    fields:
      order_id:
        type: string              # Phase 2: relation to orders, cascade: cascade
        required: true
      product_id:
        type: string              # Phase 2: relation to products
        required: true
      quantity:
        type: integer
        required: true
        min: 1
      unit_price:
        type: decimal          # exact money (ADR-0017)
        required: true
        min: 0
        label: "Price at time of order (snapshot)"
      currency:
        type: string
        default: "BDT"
        max: 3
      product_snapshot:
        type: json
        label: "Full product record snapshot at order time"
    timestamps: true
    indexes:
      - order_id
      - product_id
    access:
      read: owner                 # line items follow their order's owner
      create: authenticated
      update: [admin]
      delete: [admin]

  # ── Stories (editorial content) ────────────────────────────────────────
  stories:
    fields:
      headline:
        type: string              # Phase 2: i18n
        required: true
        max: 300
        label: "Headline"
      slug:
        type: string
        required: true
        unique: true
        pattern: "^[a-z0-9-]+$"
      content:
        type: richtext            # structured body content (ADR-0014)
        label: "Story body"
        styles: [normal, h2, h3, blockquote]
        marks:  [strong, em, link]
        blocks: [image]           # inline images reference the media library
      excerpt:
        type: string
        max: 500
        label: "Short excerpt for cards"
      author:
        type: string
        max: 200
        label: "Author display name"
      status:
        type: enum
        values: [draft, published, archived]
        default: draft
      vendor_id:
        type: string              # Phase 2: relation to vendors (optional)
        label: "Related farm / vendor"
      # cover_image:              # Phase 3
      #   type: media
    timestamps: true
    revisions: true               # keep full version history of every edit (ADR-0013)
    indexes: [status, vendor_id]
    # vectorize: [headline, content, excerpt]  # Phase 2
    # draft: true                 # Phase 2
    access:
      read: public
      create: [admin, vendor]
      update: [admin, vendor]
      delete: [admin]

  # ── Reviews ────────────────────────────────────────────────────────────
  reviews:
    fields:
      product_id:
        type: string              # Phase 2: relation to products
        required: true
      customer_id:
        type: string              # Phase 2: relation to customers
        required: true
      rating:
        type: integer
        required: true
        min: 1
        max: 5
      comment:
        type: text
      is_verified_purchase:
        type: boolean
        default: false
        access:
          write: [admin]          # field-level (ADR-0016 M2): a customer POSTing a
                                  # review cannot self-verify — the value is silently
                                  # dropped and only staff can set it.
      status:
        type: enum
        values: [pending, approved, rejected]
        default: pending
        access:
          write: [admin]          # likewise a customer cannot self-approve; new
                                  # reviews stay `pending` until staff moderate.
    timestamps: true
    indexes: [product_id, customer_id, status]
    access:
      read: public                # moderation is via `status`, not access
      create: authenticated       # only signed-in customers may review
      update: [admin]
      delete: [admin]
